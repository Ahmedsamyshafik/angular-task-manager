<!--
  CONCEPT: App Shell Layout
  ===========================
  The root template defines the overall page structure:
  1. <app-header> — always visible (navigation, user info)
  2. <router-outlet> — dynamic content area (changes with the URL)

  This is a common pattern: the "shell" stays fixed while the
  content area swaps based on the route.
-->

<!-- Header is always visible regardless of route -->
<app-header></app-header>

<!-- Main content area — router inserts the active route's component here -->
<main class="main-content">
  <!--
    CONCEPT: <router-outlet>
    This is where Angular renders the component for the current route.
    Think of it as a "slot" that gets filled based on the URL:
    - /dashboard  → DashboardPage component appears here
    - /tasks      → TaskList component appears here
    - /tasks/5    → TaskDetail component appears here
    - /auth/login → Login component appears here
  -->
  <router-outlet></router-outlet>
</main>
